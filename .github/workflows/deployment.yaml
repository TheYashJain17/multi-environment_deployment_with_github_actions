name: Multi Environment Deployment
on: 
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonning The Code
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: Install pnpm 
        uses: "pnpm/action-setup@v4"
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build Project
        run: pnpm run build
      
      - name: Upload Artifacts
        uses: "actions/upload-artifact@v4"
        with:
          name: build-file
          path: .next/**
          include-hidden-files: true
    
  stage-deployment:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Clonning Code
        uses: "actions/checkout@v4"
      
      - name: Download Artifacts 
        uses: "actions/download-artifact@v4"
        with:
          name: build-file
          path: .next

  prod-deployment:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      - name: Clonning Code
        uses: "actions/checkout@v4"
      
      - name: Download Artifacts 
        uses: "actions/download-artifact@v4"
        with:
          name: build-file
          path: .next